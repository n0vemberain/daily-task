name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'DailyTask_CodeBase/client/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'DailyTask_CodeBase/client/package-lock.json'

      - name: Install Client Dependencies
        run: |
          cd DailyTask_CodeBase/client
          npm ci

      - name: Build Production Bundle
        run: |
          cd DailyTask_CodeBase/client
          npm run build
          touch dist/.nojekyll

      - name: Deploy to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./DailyTask_CodeBase/client/dist
          publish_branch: gh-pages
          force_orphan: true
